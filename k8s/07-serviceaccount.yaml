# ==============================================================================
# CloudPulse ServiceAccount with AWS IAM Roles for Service Accounts (IRSA)
# Enables secure, temporary AWS STS token assumption without hardcoded secrets
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudpulse-serviceaccount
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse-api
    app.kubernetes.io/part-of: cloudpulse-platform
  annotations:
    # Replace <AWS_ACCOUNT_ID> and <ROLE_NAME> in production AWS environment
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/CloudPulseEksAppRole"

