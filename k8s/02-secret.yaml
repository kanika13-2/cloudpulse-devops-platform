# ==============================================================================
# CloudPulse Application Secret (Template / Local Development)
# NOTE: In AWS Production, use AWS Secrets Manager / External Secrets Operator
# or Sealed Secrets to avoid storing unencrypted plaintext in git repositories.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-secrets
  namespace: cloudpulse
  labels:
    app.kubernetes.io/name: cloudpulse-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cloudpulse-platform
type: Opaque
stringData:
  APPLICATION_SECRET_KEY: "REPLACE_WITH_SECURE_SECRET"
  DATABASE_URL: "sqlite:////tmp/cloudpulse.db"

