# ==============================================================================
# CloudPulse Pull Request Quality Gatekeeper
# Fast, lightweight verification running on all pull requests
# ==============================================================================

name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  pr-lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format Check (Black)
        run: black --check app/ tests/

      - name: Lint Check (Flake8)
        run: flake8 app/ tests/ --count --max-line-length=120 --statistics

      - name: Execute Tests (Pytest)
        run: pytest -v

      - name: Validate Kubernetes Manifests
        run: python tests/validate_k8s.py

